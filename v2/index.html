<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<title>Presupuesto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="logic.js"></script>
<style>
:root{
  --paper:#FAF7F2; --card:#fff; --ink:#24211D; --ink-2:#5C554B; --ink-3:#7A7164;
  --line:#E9E1D3; --line-2:#F2EDE3; --track:#EFE7D6;
  --p1:#8B5FBF; --p1-soft:#F1EAFA; --ok:#23704F; --ok-soft:#E4F3EC;
  --warn:#8A5A12; --warn-soft:#FBF1DC; --bad:#B0461F; --bad-soft:#FBEAE2;
  --r:18px; --tab:64px;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100dvh;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
.num{font-family:'Fraunces',Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3);font-size:12.5px}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
body.privado .m{filter:blur(7px);user-select:none}

/* ---------- screens ---------- */
.screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px calc(32px + var(--safe-b));text-align:center}
.screen .logo{width:76px;height:76px;border-radius:20px}
.screen h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;letter-spacing:-.02em}
.screen p{color:var(--ink-2);max-width:300px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .1s ease-out}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:#fff}
.btn-soft{background:var(--line-2);color:var(--ink)}
.btn-bad{background:var(--bad-soft);color:var(--bad)}
.btn-block{width:100%}
.btn:disabled{opacity:.35}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(250,247,242,.82);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.top{padding-left:max(16px,calc(50% - 264px));padding-right:max(16px,calc(50% - 264px))}
.month-btn{display:flex;align-items:baseline;gap:6px;padding:6px 4px;margin-right:auto;border-radius:10px}
.month-btn b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.02em}
.month-btn span{color:var(--ink-3);font-size:14px}
.month-btn i{font-style:normal;color:var(--ink-3);font-size:12px;transform:translateY(-2px)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--line-2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:560px;margin:0 auto;padding:4px 16px calc(var(--tab) + var(--safe-b) + 90px)}
.banner{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.link{color:var(--ink-2);font-size:13px;font-weight:600;padding:6px 0}
.link:active{opacity:.6}
.empty{color:var(--ink-3);font-size:13.5px;padding:8px 0 4px;line-height:1.5}
.onb{display:flex;gap:12px;align-items:center;width:100%;padding:14px;margin-bottom:12px;border-radius:var(--r);background:var(--ink);color:#fff}
.onb b{display:block;font-size:14px}
.onb span{font-size:12.5px;opacity:.75}
.onb i{font-style:normal;margin-left:auto;font-size:20px;opacity:.6}

/* ---------- balance (signature) ---------- */
.bal-top{display:flex;justify-content:space-between;align-items:center}
.bal-big{font-size:40px;font-weight:600;line-height:1.1;margin-top:4px;letter-spacing:-.03em}
.bal-big.neg{color:var(--bad)}
.bal-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
.bar{position:relative;height:12px;border-radius:7px;background:var(--track);display:flex;overflow:visible;margin-bottom:8px}
.seg{height:100%;transition:width .4s cubic-bezier(.32,.72,0,1)}
.seg:first-child{border-radius:7px 0 0 7px}
.s-fijo{background:var(--ink)}
.s-var{background:var(--ok)}
.s-pend{background:repeating-linear-gradient(135deg,#CFC4AE 0 3px,transparent 3px 6px)}
.mk{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:1px;transform:translateX(-1px)}
.mk-ing{background:var(--p1)}
.mk-pre{background:repeating-linear-gradient(var(--ink-2) 0 3px,transparent 3px 5px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink-3);margin-bottom:14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line-2);padding-top:12px}
.fig{display:flex;flex-direction:column;gap:2px;border-radius:10px}
.fig b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px}
.fig.tap span::after{content:' ›'}
.vs{margin-top:12px;font-size:13px;color:var(--ink-2);display:block;width:100%}
.vs strong{font-weight:700}
.vs .ok{color:var(--ok)} .vs .bad{color:var(--bad)}

/* ---------- fixed payments ---------- */
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2)}
.frow:first-of-type{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:transform .12s ease-out,background .15s}
.chk:active{transform:scale(.88)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:'';width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.frow-main{flex:1;display:flex;align-items:center;gap:10px;min-width:0;padding:4px 0}
.day{flex:none;width:34px;text-align:center;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;line-height:1}
.flabel{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.flabel b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-style:normal;align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--line-2);color:var(--ink-2)}
.st-pagado .pill{background:var(--ok-soft);color:var(--ok)}
.st-pagado .flabel b,.st-pagado .amt{color:var(--ink-3)}
.st-atrasado .pill{background:var(--bad-soft);color:var(--bad)}
.st-hoy .pill{background:var(--bad);color:#fff}
.st-pronto .pill{background:var(--warn-soft);color:var(--warn)}
.amt{flex:none;font-weight:600;font-size:15px}

/* ---------- categories / movements ---------- */
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;border-top:1px solid var(--line-2)}
.crow:first-of-type{border-top:0}
.cico{flex:none;width:36px;height:36px;border-radius:11px;background:var(--line-2);display:grid;place-items:center;font-size:18px}
.cmid{flex:1;min-width:0}
.cmid b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmid span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar{height:4px;border-radius:2px;background:var(--track);margin-top:6px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.cbar.over i{background:var(--bad)}
.flabel .cbar{margin-top:2px}
.st-parcial .pill{background:var(--warn-soft);color:var(--warn)}
.paid{border-top:1px solid var(--line-2);margin-top:4px}
.paid summary{list-style:none;cursor:pointer;padding:12px 0 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.paid summary::-webkit-details-marker{display:none}
.paid summary::before{content:'›';display:inline-block;margin-right:8px;transition:transform .2s}
.paid[open] summary::before{transform:rotate(90deg)}
.day-h{font-size:12px;font-weight:700;color:var(--ink-3);margin:16px 4px 6px}
.day-h::first-letter{text-transform:uppercase}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--line-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--ink-2);white-space:nowrap;transition:transform .1s ease-out}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- tab bar + fab ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 8px calc(6px + var(--safe-b));background:rgba(250,247,242,.85);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-top:1px solid rgba(233,225,211,.7)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--tab) + var(--safe-b) + 16px);z-index:31;width:60px;height:60px;border-radius:20px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(36,33,29,.28);transition:transform .12s ease-out}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(36,33,29,.38);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;max-height:90dvh;display:flex;flex-direction:column;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(36,33,29,.18);transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;padding:8px 20px 6px;touch-action:none;cursor:grab}
.grab::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.grab h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;letter-spacing:-.02em}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px calc(20px + var(--safe-b))}
.field{margin-bottom:16px}
.field>label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
.inp:focus{border-color:var(--ink)}
.inp-big{min-height:64px;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.switch{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600}
.switch i{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.switch.on i{background:var(--ok)}
.switch.on i::after{transform:translateX(20px)}
.inc-row{display:grid;grid-template-columns:44px 1fr 110px 36px;gap:6px;margin-bottom:8px}
.inc-row .inp{min-height:44px;font-size:15px;padding:0 10px}
.sign{border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:18px}
.sign.neg{background:var(--bad-soft);color:var(--bad)}
.x{border-radius:12px;color:var(--ink-3);font-size:20px}
.person-h{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 0 10px}
.person-h .m{margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji{aspect-ratio:1;border-radius:10px;font-size:20px;display:grid;place-items:center}
.emoji.on{background:var(--ink)}
.list-row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 4px;border-top:1px solid var(--line-2)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.list-row .chev{color:var(--ink-3)}
.steps{padding-left:20px;line-height:1.6;color:var(--ink-2);font-size:14px}
.steps li{margin-bottom:8px}
.code{display:block;margin-top:6px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font:12px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--ink)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);z-index:60;transform:translate(-50%,-20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;white-space:nowrap;transition:opacity .2s,transform .3s cubic-bezier(.32,.72,0,1)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#F3D9A4;font-weight:700}

@media (prefers-reduced-motion:reduce){
  .sheet,.toast,.seg,.switch i::after{transition:opacity .2s!important}
  .sheet{transform:none;opacity:0;pointer-events:none}
  .sheet.on{opacity:1;pointer-events:auto}
}
@media (prefers-reduced-transparency:reduce){
  .top,.tabs{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>

<div class="screen" id="s-loading"><p>Cargando…</p></div>

<div class="screen hidden" id="s-login">
  <img class="logo" src="icon-180.png" alt="">
  <h1>Presupuesto</h1>
  <p>Acceso privado. Entra con tu cuenta de Google para ver el presupuesto.</p>
  <button class="btn btn-dark" id="btn-login">Entrar con Google</button>
  <p class="muted" id="login-err"></p>
</div>

<div class="screen hidden" id="s-denied">
  <h1>Sin acceso</h1>
  <p>La cuenta <b id="denied-email"></b> no tiene permiso para ver este presupuesto.</p>
  <button class="btn btn-soft" data-act="logout">Usar otra cuenta</button>
</div>

<div class="hidden" id="s-app">
  <header class="top">
    <button class="month-btn" data-act="meses" aria-label="Cambiar de mes"><b id="h-month"></b><span id="h-year"></span><i>▼</i></button>
    <button class="icon-btn" data-act="privado" id="btn-eye" aria-label="Ocultar cifras"></button>
  </header>
  <main id="view"></main>
  <button class="fab" data-act="gasto" aria-label="Agregar gasto"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabs">
    <button class="tab" data-act="tab" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="tab" data-act="tab" data-v="mov"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
    <button class="tab" data-act="tab" data-v="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>
</div>

<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab" id="grab"><h3 id="sheet-title"></h3></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" class="hidden">Deshacer</button></div>

<script>
/* ======================= FIREBASE ======================= */
const firebaseConfig = {
  apiKey: "AIzaSyBxrMX0rNk866H7gm92pj3hvizP66Ww70I",
  authDomain: "presupuesto-hogar-1327.firebaseapp.com",
  databaseURL: "https://presupuesto-hogar-1327-default-rtdb.firebaseio.com",
  projectId: "presupuesto-hogar-1327",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'es';
const db = firebase.database();
const R = p => db.ref(p ? 'v2/' + p : 'v2');
const uid = () => db.ref().push().key;

/* ======================= STATE ======================= */
const {vals, parseN, fmt} = L;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date();
const TODAY_KEY = () => L.monthKey(today());
let config = null, meses = {}, cur = TODAY_KEY(), view = 'inicio', filtro = '', ready = false, user = null;
let deepLink = null;
const M = () => meses[cur] || {};
const P = p => ((config && config.personas) || {})[p] || {};
const pname = p => P(p).nombre || (p === 'p1' ? 'Persona 1' : 'Persona 2');
const cats = () => Object.entries((config && config.categorias) || {}).sort((a, b) => (a[1].orden || 0) - (b[1].orden || 0));
const cat = id => ((config && config.categorias) || {})[id];

/* ======================= WRITES ======================= */
function fail(e){ console.error(e); toast(String(e && e.code || e).includes('permission') ? 'Sin permiso para guardar' : 'No se pudo guardar'); }
const set = (p, v) => R(p).set(v).catch(fail);
const patch = o => R().update(o).catch(fail);

/* ======================= AUTH ======================= */
function show(id){ ['s-loading','s-login','s-denied','s-app'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

$('btn-login').onclick = async () => {
  $('login-err').textContent = '';
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt: 'select_account'});
  try { await auth.signInWithPopup(prov); }
  catch(e){
    // Installed iOS apps can block popups; fall back to a full-page redirect.
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) return auth.signInWithRedirect(prov);
    if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) $('login-err').textContent = 'No se pudo entrar (' + e.code + '). Intenta de nuevo.';
  }
};

auth.onAuthStateChanged(u => {
  user = u;
  R().off();
  if(!u){ ready = false; show('s-login'); return; }
  show('s-loading');
  R().on('value', onData, err => { $('denied-email').textContent = u.email || ''; show('s-denied'); });
  checkRules();
});

// If the database answers without login, the Firebase rules are still open: warn loudly.
let rulesOpen = false;
function checkRules(){
  fetch(firebaseConfig.databaseURL + '/v2.json?shallow=true').then(r => { rulesOpen = r.ok; if(ready) render(); }).catch(() => {});
}

/* ======================= DATA ======================= */
async function onData(snap){
  const v = snap.val() || {};
  if(!v.config){ return bootstrap(v); }
  config = v.config;
  meses = v.meses || {};
  if(!meses[TODAY_KEY()]){ return createMonth(TODAY_KEY()); }
  if(!meses[cur]) cur = TODAY_KEY();
  if(!ready){ ready = true; show('s-app'); if(config.version !== 3) migracionSheet(); else handleDeepLink(); }
  render();
}

// One-time switch to the plan model: the v1 December amounts become December's plan (nothing paid yet),
// and the lines they mark "Cada mes" become the recurring plan for the following months.
async function migracionSheet(){
  // The plan comes from v1 itself, so payments registered in v2 meanwhile are neither counted nor deleted.
  let imported = null;
  try { imported = L.importV1({[PLAN_MONTH]: (await db.ref('meses/' + PLAN_MONTH).get()).val()}, null).meses[PLAN_MONTH]; } catch(e){}
  const gastos = (imported && imported.gastos) || (meses[PLAN_MONTH] || {}).gastos || {};
  const lines = L.planFromGastos(gastos, config.categorias);
  const rec = lines.map(() => true);
  const finish = () => {
    if(config.version === 3) return closeSheet(); // the other phone already converted
    const tpl = {}, plan = {}, upd = {'config/version': 3};
    lines.forEach((l, i) => { const id = uid(); plan[id] = l; if(rec[i]) tpl[id] = l; });
    upd['config/fijos'] = tpl;
    if(meses[PLAN_MONTH]){
      upd['meses/' + PLAN_MONTH + '/fijos'] = plan;
      Object.keys(gastos).forEach(id => upd['meses/' + PLAN_MONTH + '/gastos/' + id] = null); // only the imported v1 amounts
    }
    else if(lines.length) upd['meses/' + PLAN_MONTH] = Object.assign({}, imported, {fijos: plan, gastos: {}});
    // Lines from the old model (fixed payments with a paid flag) don't apply anymore.
    Object.keys(meses).forEach(k => { if(k !== PLAN_MONTH) upd['meses/' + k + '/fijos'] = k > PLAN_MONTH ? tpl : null; });
    patch(upd).then(() => { closeSheet(); cur = meses[PLAN_MONTH] || lines.length ? PLAN_MONTH : cur; render(); toast('Plan creado'); });
  };
  if(!lines.length) return finish();
  const row = (l, i) => { const c = cat(l.catId) || {icon: '•', label: ''}; return `<div class="list-row"><span class="cico">${esc(c.icon)}</span><span class="grow">${esc(l.label)}<br><span class="muted">${esc(c.label)} · <span class="m">${fmt(l.monto)}</span></span></span><button type="button" class="chip on" data-i="${i}">Cada mes</button></div>`; };
  openSheet('Plan de ' + L.monthLabel(PLAN_MONTH), `
    <p style="color:var(--ink-2);margin-bottom:12px">Lo que tenían en la v1 para ${L.monthName(PLAN_MONTH).toLowerCase()} pasa a ser <b>el plan del mes</b>, sin nada pagado todavía. Toquen <b>Cada mes</b> en lo que es solo de ${L.monthName(PLAN_MONTH).toLowerCase()} para que no se repita en los meses siguientes.</p>
    <div class="card" style="padding:2px 12px">${lines.map(row).join('')}</div>
    <div class="actions"><button class="btn btn-dark btn-block" id="mg-ok">Crear plan</button></div>`, b => {
    b.onclick = e => {
      const c = e.target.closest('[data-i]'); if(!c) return;
      const i = +c.dataset.i; rec[i] = !rec[i];
      c.classList.toggle('on', rec[i]); c.textContent = rec[i] ? 'Cada mes' : 'Solo ' + L.monthName(PLAN_MONTH).toLowerCase();
    };
    b.querySelector('#mg-ok').onclick = finish;
  });
}

// First run: import v1 data once (if any), else start with defaults.
let booting = false;
async function bootstrap(v){
  if(booting) return;
  booting = true;
  let v1m = null, v1c = null;
  try { [v1m, v1c] = (await Promise.all([db.ref('meses').get(), db.ref('categorias').get()])).map(s => s.val()); } catch(e){}
  const imp = L.importV1(v1m, v1c);
  const upd = {config: {
    categorias: Object.keys(imp.categorias).length ? imp.categorias : DEFAULT_CATS,
    personas: {p1: {nombre: '', base: 0}, p2: {nombre: '', base: 0}},
  }};
  if(!v.meses) Object.entries(imp.meses).forEach(([k, m]) => upd['meses/' + k] = m);
  await patch(upd);
}

function latestBefore(k){ return Object.keys(meses).filter(x => x < k).sort().pop(); }
function createMonth(k){
  const prev = meses[latestBefore(k)] || meses[Object.keys(meses).sort().pop()];
  return set('meses/' + k, L.newMonth(config, prev, uid));
}

function vInicio(){
  const t = L.totals(M());
  let h = '';
  if(!P('p1').nombre || !P('p1').base) h += `<button class="onb" data-act="personas"><div><b>Configura nombres e ingresos base</b><span>Se cargan solos cada mes</span></div><i>›</i></button>`;

  // balance
  const scale = Math.max(t.ingresos, t.proyeccion, t.presupuestado, 1);
  const pc = n => (n / scale * 100).toFixed(2) + '%';
  const vs = t.presupuestado && Math.abs(t.vsPresupuesto) < 0.5 ? "La proyección coincide con el presupuesto" : t.presupuestado
    ? (t.vsPresupuesto >= 0 ? `Proyección <strong class="ok m">${fmt(t.vsPresupuesto)}</strong> por debajo del presupuesto` : `Proyección <strong class="bad m">${fmt(-t.vsPresupuesto)}</strong> por encima del presupuesto`)

  h += `<section class="card">
    <div class="bal-top"><span class="eyebrow">${t.disponible >= 0 ? 'Les sobra al cierre' : 'Les falta al cierre'}</span><button class="link" data-act="presu">Presupuesto ›</button></div>

    <div class="bal-sub">si pagan todo lo previsto este mes</div>
    <div class="bar" role="img" aria-label="Gastado ${fmt(t.gastado)}, por pagar ${fmt(t.pendiente)}, ingresos ${fmt(t.ingresos)}">
      <i class="seg s-fijo" style="width:${pc(t.enPlan)}"></i><i class="seg s-var" style="width:${pc(t.fueraPlan)}"></i><i class="seg s-pend" style="width:${pc(t.pendiente)}"></i>
      ${t.ingresos ? `<b class="mk mk-ing" style="left:${pc(t.ingresos)}"></b>` : ''}${t.presupuestado ? `<b class="mk mk-pre" style="left:${pc(t.presupuestado)}"></b>` : ''}
    </div>
    <div class="legend"><span><i style="background:var(--ink)"></i>Pagado del plan</span><span><i style="background:var(--ok)"></i>Fuera del plan</span><span><i style="background:#CFC4AE"></i>Por pagar</span><span><i style="background:var(--p1);width:2px"></i>Ingresos</span>${t.presupuestado ? '<span><i style="background:var(--ink-2);width:2px"></i>Presupuesto</span>' : ''}</div>
    <div class="figs">
      <button class="fig tap" data-act="ingresos"><span class="eyebrow">Ingresos</span><b class="m">${fmt(t.ingresos)}</b></button>
      <div class="fig"><span class="eyebrow">Pagado</span><b class="m">${fmt(t.gastado)}</b></div>
      <div class="fig"><span class="eyebrow">Por pagar</span><b class="m">${fmt(t.pendiente)}</b></div>
    </div>
    <button class="vs" data-act="presu">${vs}</button>
  </section>`;

  // plan of the month: pending first (by urgency, then due day), paid ones folded at the end
  const real = L.realPorLinea(M());
  const ORDER = {atrasado: 0, hoy: 1, pronto: 2, parcial: 3, pendiente: 4, mes: 5, pagado: 6};
  const lines = Object.entries(M().fijos || {}).map(([id, l]) => { const r = real[L.lineKey(l.catId, l.subId)] || 0; return {id, l, r, st: L.lineStatus(l, r, cur, today())}; })
    .sort((a, b) => (ORDER[a.st.code] - ORDER[b.st.code]) || ((a.l.dia || 32) - (b.l.dia || 32)));
  const pend = lines.filter(x => x.st.code !== 'pagado'), paid = lines.filter(x => x.st.code === 'pagado');
  const lineRow = ({id, l, r, st}) => {
    const m = parseN(l.monto), c = cat(l.catId) || {icon: '•'};
    const amt = st.code === 'parcial' ? `${fmt(r)}<br><span class="muted">de ${fmt(m)}</span>` : fmt(st.code === 'pagado' ? r : m);
    return `<div class="frow st-${st.code}">
      <button class="chk ${st.code === 'pagado' ? 'on' : ''}" data-act="togglePago" data-id="${id}" aria-label="${st.code === 'pagado' ? 'Desmarcar' : 'Marcar'} ${esc(l.label)} como pagado"></button>
      <button class="frow-main" data-act="linea" data-id="${id}">
        <span class="day">${l.dia ? L.dueDay(cur, l.dia) : `<span style="font-size:17px">${esc(c.icon)}</span>`}</span>
        <span class="flabel"><b>${esc(l.label)}</b><em class="pill">${m || r ? st.label : 'Falta monto'}</em>${st.code === 'parcial' ? `<span class="cbar"><i style="width:${(r / m * 100).toFixed(1)}%"></i></span>` : ''}</span>
        <span class="amt num m" style="text-align:right">${amt}</span>
      </button></div>`;
  };
  h += `<section class="card"><div class="sec-h"><h2>Plan del mes</h2><span class="muted">${lines.length ? paid.length + ' de ' + lines.length + ' pagados' : ''}</span></div>`;
  if(!lines.length){
    h += Object.keys(config.fijos || {}).length
      ? `<p class="empty">Este mes todavía no tiene plan.</p><button class="btn btn-soft btn-block" data-act="cargarFijos">Cargar el plan recurrente</button>`
      : `<p class="empty">Agreguen lo que piensan pagar este mes: renta, créditos, mercado…</p>`;
  }
  h += pend.map(lineRow).join('');
  if(paid.length) h += `<details class="paid"><summary>Pagados (${paid.length}) · <span class="m">${fmt(paid.reduce((s, x) => s + x.r, 0))}</span></summary>${paid.map(lineRow).join('')}</details>`;
  h += `<button class="link" data-act="linea">+ Agregar al plan de este mes</button></section>`;

  // by category: paid vs planned
  const cids = [...new Set([...Object.keys(t.planCat), ...Object.keys(t.porCat)])].sort((a, b) => Math.max(t.planCat[b] || 0, t.porCat[b] || 0) - Math.max(t.planCat[a] || 0, t.porCat[a] || 0));
  h += `<section class="card"><div class="sec-h"><h2>Por categoría</h2><span class="muted">pagado / plan</span></div>`;
  if(!cids.length) h += `<p class="empty">Cuando tengan plan o pagos, aquí verán en qué se va el dinero.</p>`;
  cids.forEach(cid => {
    const c = cat(cid) || {label: 'Sin categoría', icon: '•'}, v = t.porCat[cid] || 0, p = t.planCat[cid] || 0;
    const w = p ? Math.min(100, v / p * 100) : 100;
    h += `<button class="crow" data-act="verCat" data-id="${esc(cid)}"><span class="cico">${esc(c.icon)}</span><span class="cmid"><b>${esc(c.label)}</b><span class="cbar ${p && v > p ? 'over' : ''}"><i style="width:${w.toFixed(1)}%"></i></span></span><span class="amt num m" style="text-align:right">${fmt(v)}${p ? `<br><span class="muted">de ${fmt(p)}</span>` : ''}</span></button>`;
  });
  return h + `</section>`;
}

function movimientos(){
  const out = [];
  Object.entries(M().gastos || {}).forEach(([id, g]) => out.push({id, kind: 'gasto', catId: g.catId, fecha: g.fecha || 0, monto: parseN(g.monto), title: (cat(g.catId) || {subs: {}}).subs?.[g.subId] || (cat(g.catId) || {}).label || 'Gasto', nota: g.nota}));
  return out.filter(x => !filtro || x.catId === filtro).sort((a, b) => b.fecha - a.fecha);
}

  let h = `<div class="filters"><button class="chip ${!filtro ? 'on' : ''}" data-act="filtro" data-id="">Todas</button>`;
  Object.keys(t.porCat).forEach(cid => { const c = cat(cid) || {label: 'Sin categoría', icon: '•'}; h += `<button class="chip ${filtro === cid ? 'on' : ''}" data-act="filtro" data-id="${esc(cid)}"><span>${esc(c.icon)}</span>${esc(c.label)}</button>`; });

  return h;
}

/* ======================= SHEET ======================= */
const sheet = $('sheet'), scrim = $('scrim');
let onClose = null;
function openSheet(title, html, after){
  $('sheet-title').textContent = title;
  $('sheet-body').innerHTML = html;
  $('sheet-body').scrollTop = 0;
  sheet.style.transform = '';
  sheet.classList.add('on'); scrim.classList.add('on');
  if(after) after($('sheet-body'));
}
function closeSheet(){
  sheet.classList.remove('on'); scrim.classList.remove('on');
  sheet.style.transform = '';
  document.activeElement && document.activeElement.blur();
}
// Drag the handle down to dismiss; follows the finger 1:1, decides by distance or flick speed.
(() => {
  let y0 = 0, t0 = 0, dy = 0, lastY = 0, lastT = 0, v = 0, dragging = false;
  $('grab').addEventListener('pointerdown', e => { dragging = true; y0 = lastY = e.clientY; t0 = lastT = e.timeStamp; dy = 0; v = 0; sheet.classList.add('drag'); $('grab').setPointerCapture(e.pointerId); });
  $('grab').addEventListener('pointermove', e => {
    if(!dragging) return;
    dy = e.clientY - y0;
    const dt = e.timeStamp - lastT; if(dt > 0) v = (e.clientY - lastY) / dt; lastY = e.clientY; lastT = e.timeStamp;
    sheet.style.transform = `translateY(${dy > 0 ? dy : dy / 6}px)`;
  });
  const end = () => { if(!dragging) return; dragging = false; sheet.classList.remove('drag'); if(dy > 110 || v > 0.6) closeSheet(); else sheet.style.transform = ''; };
  $('grab').addEventListener('pointerup', end);
  $('grab').addEventListener('pointercancel', end);
})();

function confirmSheet(title, msg, label, fn){
  openSheet(title, `<p style="color:var(--ink-2);margin-bottom:18px">${msg}</p><div class="actions"><button class="btn btn-bad btn-block" id="c-yes">${esc(label)}</button><button class="btn btn-soft btn-block" data-act="close">Cancelar</button></div>`,
    b => b.querySelector('#c-yes').onclick = () => { fn(); closeSheet(); });
}

let toastT;
function toast(msg, undo){
  $('toast-msg').textContent = msg;
  const u = $('toast-undo');
  u.classList.toggle('hidden', !undo);
  u.onclick = () => { undo(); $('toast').classList.remove('on'); };
  $('toast').classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), undo ? 5000 : 2200);
}

function chipsHtml(items, sel, name){
  return `<div class="chips" data-name="${name}">` + items.map(([id, label]) => `<button type="button" class="chip ${id === sel ? 'on' : ''}" data-val="${esc(id)}">${label}</button>`).join('') + `</div>`;
}
function bindChips(root, name, onPick){
  const box = root.querySelector(`[data-name="${name}"]`);
  box.onclick = e => { const b = e.target.closest('.chip'); if(!b) return; box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); onPick(b.dataset.val); };
}
const catChipItems = () => cats().map(([id, c]) => [id, `<span>${esc(c.icon)}</span>${esc(c.label)}`]);
const isoDate = ms => { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12).getTime(); };
const amountInput = (id, val, big) => `<input class="inp ${big ? 'inp-big' : ''} num" id="${id}" inputmode="decimal" autocomplete="off" placeholder="$0" value="${val ? esc(val) : ''}">`;

/* ----- gasto (variable) ----- */
function gastoSheet(id, prefill){
  const g = id ? (M().gastos || {})[id] : null;
  let catId = g ? g.catId : (prefill && prefill.catId) || '', subId = g ? g.subId : (prefill && prefill.subId) || '';
  const defFecha = g && g.fecha ? g.fecha : (cur === TODAY_KEY() ? Date.now() : fromIso(cur + '-01'));
  openSheet(g ? 'Editar gasto' : 'Nuevo gasto', `
    <div class="field">${amountInput('g-monto', g ? g.monto : (prefill && prefill.monto), true)}</div>
    <div class="field"><span class="lbl">Categoría</span>${chipsHtml(catChipItems(), catId, 'cat')}</div>
    <div class="field" id="g-subs"></div>
    <div class="row2 field"><input class="inp" id="g-nota" placeholder="Nota (opcional)" value="${esc(g ? g.nota : (prefill && prefill.nota) || '')}"><input class="inp" type="date" id="g-fecha" value="${isoDate(defFecha)}"></div>
    <div class="actions"><button class="btn btn-dark btn-block" id="g-save">${g ? 'Guardar cambios' : 'Agregar gasto'}</button>${g ? '<button class="btn btn-bad btn-block" id="g-del">Eliminar gasto</button>' : ''}</div>`, b => {
    const subs = () => {
      const c = cat(catId);
      const items = Object.entries((c && c.subs) || {}).map(([sid, l]) => [sid, esc(l)]);
      b.querySelector('#g-subs').innerHTML = catId ? (items.length ? `<span class="lbl">Subcategoría</span>${chipsHtml(items, subId, 'sub')}<p class="muted" id="g-hint" style="margin-top:8px"></p>` : '<p class="muted">Sin subcategorías. Puedes agregarlas en Ajustes.</p>') : '';
      if(items.length) bindChips(b, 'sub', v => { subId = v; hint(); valid(); });
      hint();
    };
    // Shows how this payment fits the month's plan for the chosen subcategory.
    const hint = () => {
      const el = b.querySelector('#g-hint'); if(!el) return;
      const line = vals(M().fijos).find(l => L.lineKey(l.catId, l.subId) === L.lineKey(catId, subId));
      const r = line ? L.realDe(M(), line) - (g && L.lineKey(g.catId, g.subId) === L.lineKey(catId, subId) ? parseN(g.monto) : 0) : 0;
      el.innerHTML = !subId ? '' : line ? `En el plan: pagado <span class="m">${fmt(r)}</span> de <span class="m">${fmt(parseN(line.monto))}</span>` : 'No está en el plan: cuenta como gasto fuera del plan.';
    };
    const valid = () => b.querySelector('#g-save').disabled = !(parseN(b.querySelector('#g-monto').value) > 0 && catId);
    bindChips(b, 'cat', v => { catId = v; subId = ''; subs(); valid(); });
    subs(); valid();
    b.querySelector('#g-monto').oninput = valid;
    if(!g && !(prefill && prefill.monto)) b.querySelector('#g-monto').focus();
    b.querySelector('#g-save').onclick = () => {
      const data = {catId, subId: subId || '', monto: parseN(b.querySelector('#g-monto').value), nota: b.querySelector('#g-nota').value.trim(), fecha: b.querySelector('#g-fecha').value ? fromIso(b.querySelector('#g-fecha').value) : Date.now()};
      if(g && g.planId) data.planId = g.planId;
      set('meses/' + cur + '/gastos/' + (id || uid()), data);
      closeSheet(); toast(g ? 'Gasto actualizado' : 'Gasto agregado');
    };
    if(g) b.querySelector('#g-del').onclick = () => {
      const path = 'meses/' + cur + '/gastos/' + id, old = g;
      R(path).remove().catch(fail); closeSheet();
      toast('Gasto eliminado', () => set(path, old));
    };
  });
}

/* ----- plan lines (shared form for a month line and a recurring line) ----- */
function lineFormHtml(l){
  return `<div class="field"><span class="lbl">Categoría</span>${chipsHtml(catChipItems(), l.catId, 'cat')}</div>
    <div class="field" id="l-subs"></div>
    <div class="field"><label>Nombre</label><input class="inp" id="l-label" value="${esc(l.label)}" placeholder="Ej. Renta"></div>
    <div class="row2 field"><div><span class="lbl">Monto previsto</span>${amountInput('l-monto', l.monto)}</div><div><span class="lbl">Día de pago</span><input class="inp" id="l-dia" inputmode="numeric" placeholder="Sin fecha" value="${l.dia || ''}"></div></div>`;
}
// Wires category/subcategory chips; returns a reader for the form values.
function bindLineForm(b, l){
  let catId = l.catId || '', subId = l.subId || '';
  const lab = b.querySelector('#l-label');
  const subs = () => {
    const items = Object.entries((cat(catId) || {}).subs || {}).map(([sid, s]) => [sid, esc(s)]);
    b.querySelector('#l-subs').innerHTML = catId && items.length ? `<span class="lbl">Subcategoría</span>${chipsHtml(items, subId, 'sub')}` : '';
    if(items.length) bindChips(b, 'sub', v => { const prev = ((cat(catId) || {}).subs || {})[subId]; if(!lab.value || lab.value === prev) lab.value = cat(catId).subs[v]; subId = v; });
  };
  bindChips(b, 'cat', v => { catId = v; subId = ''; subs(); });
  subs();
  return () => ({label: lab.value.trim() || ((cat(catId) || {}).subs || {})[subId] || '', catId, subId, monto: parseN(b.querySelector('#l-monto').value), dia: Math.min(31, Math.max(0, parseInt(b.querySelector('#l-dia').value) || 0))});
}
function lineError(data, id, plan){
  if(!data.catId) return 'Elige una categoría';
  if(Object.keys((cat(data.catId) || {}).subs || {}).length && !data.subId) return 'Elige una subcategoría';
  if(!data.label) return 'Ponle un nombre';
  const dup = Object.entries(plan || {}).find(([oid, o]) => oid !== id && L.lineKey(o.catId, o.subId) === L.lineKey(data.catId, data.subId));
  return dup ? `"${dup[1].label}" ya está en el plan con esa subcategoría` : '';
}

/* ----- línea del plan de este mes ----- */
function lineaSheet(id){
  const l = id ? (M().fijos || {})[id] : {label: '', catId: '', subId: '', monto: 0, dia: 0};
  if(!l) return;
  let rec = !!(id && (config.fijos || {})[id]);
  const pagos = id ? Object.entries(M().gastos || {}).filter(([, g]) => L.lineKey(g.catId, g.subId) === L.lineKey(l.catId, l.subId)).sort((a, b) => (b[1].fecha || 0) - (a[1].fecha || 0)) : [];
  const r = pagos.reduce((s, [, g]) => s + parseN(g.monto), 0), m = parseN(l.monto);
  const pagosHtml = id ? `<div class="card" style="padding:12px 14px">
      <div class="sec-h" style="margin-bottom:4px"><h2 class="m">Pagado ${fmt(r)} de ${fmt(m)}</h2></div>
      ${pagos.map(([gid, g]) => `<button class="list-row" data-gasto="${gid}"><span class="grow">${new Date(g.fecha || 0).toLocaleDateString('es-CO', {day: 'numeric', month: 'short'})}${g.nota ? ' · ' + esc(g.nota) : ''}</span><span class="num m">${fmt(parseN(g.monto))}</span><span class="chev">›</span></button>`).join('')}
      <button class="btn btn-soft btn-block" style="margin-top:8px" id="l-pay">Registrar pago${m > r ? ' de ' + fmt(m - r) : ''}</button></div>` : '';
  openSheet(id ? l.label : 'Agregar al plan de ' + L.monthName(cur), pagosHtml + lineFormHtml(l) + `
    <div class="switch ${rec ? 'on' : ''}" id="l-rec" role="switch" aria-checked="${rec}" tabindex="0" style="margin-bottom:6px"><span>Se repite cada mes</span><i></i></div>
    <p class="muted" style="margin-bottom:14px">Si se repite, los cambios también aplican a los meses siguientes.</p>
    <div class="actions"><button class="btn btn-dark btn-block" id="l-save">Guardar</button>${id ? '<button class="btn btn-bad btn-block" id="l-del">Quitar de este mes</button>' : ''}</div>`, b => {
    const read = bindLineForm(b, l);
    const sw = b.querySelector('#l-rec');
    sw.onclick = () => { rec = !rec; sw.classList.toggle('on', rec); sw.setAttribute('aria-checked', rec); };
    sw.onkeydown = e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); sw.onclick(); } };
    b.querySelectorAll('[data-gasto]').forEach(el => el.onclick = () => gastoSheet(el.dataset.gasto));
    if(id) b.querySelector('#l-pay').onclick = () => gastoSheet(null, {catId: l.catId, subId: l.subId, monto: Math.max(0, m - r) || ''});
    b.querySelector('#l-save').onclick = () => {
      const data = read(), lid = id || uid(), err = lineError(data, lid, M().fijos);
      if(err) return toast(err);
      const upd = {['meses/' + cur + '/fijos/' + lid]: data};
      if(rec){
        upd['config/fijos/' + lid] = data;
        Object.keys(meses).forEach(k => { if(k > cur && !lineError(data, lid, meses[k].fijos)) upd['meses/' + k + '/fijos/' + lid] = data; });
      } else if((config.fijos || {})[lid]){
        upd['config/fijos/' + lid] = null;
        Object.keys(meses).forEach(k => { if(k > cur) upd['meses/' + k + '/fijos/' + lid] = null; });
      }
      patch(upd); closeSheet(); toast('Plan actualizado');
    };
    if(id) b.querySelector('#l-del').onclick = () => {
      const path = 'meses/' + cur + '/fijos/' + id;
      R(path).remove().catch(fail); closeSheet(); toast('Quitado del plan de ' + L.monthName(cur), () => set(path, l));
    };
  });
}

/* ----- línea del plan recurrente (Ajustes) ----- */
function lineaTSheet(id){
  const l = id ? config.fijos[id] : {label: '', catId: '', subId: '', monto: 0, dia: 0};
  const desde = cur > TODAY_KEY() ? cur : TODAY_KEY();
  openSheet(id ? 'Plan recurrente' : 'Agregar al plan recurrente', lineFormHtml(l) + `
    <p class="muted" style="margin-bottom:14px">Aparece en cada mes nuevo y se actualiza desde ${L.monthLabel(desde)}. Los pagos ya registrados no cambian.</p>
    <div class="actions"><button class="btn btn-dark btn-block" id="t-save">Guardar</button>${id ? '<button class="btn btn-bad btn-block" id="t-del">Dejar de repetir</button>' : ''}</div>`, b => {
    const read = bindLineForm(b, l);
    b.querySelector('#t-save').onclick = () => {
      const data = read(), lid = id || uid(), err = lineError(data, lid, config.fijos);
      if(err) return toast(err);
      const upd = {['config/fijos/' + lid]: data};
      Object.keys(meses).forEach(k => { if(k >= desde && !lineError(data, lid, meses[k].fijos)) upd['meses/' + k + '/fijos/' + lid] = data; });
      patch(upd); closeSheet(); toast('Plan recurrente guardado');
    };
    if(id) b.querySelector('#t-del').onclick = () => confirmSheet('Dejar de repetir', `"${esc(l.label)}" ya no se agregará a los meses nuevos y se quita de los meses después de ${L.monthLabel(desde)}. Los meses actuales y pasados no cambian.`, 'Dejar de repetir', () => {
      const upd = {['config/fijos/' + id]: null};
      Object.keys(meses).forEach(k => { if(k > desde) upd['meses/' + k + '/fijos/' + id] = null; });
      patch(upd); toast('Ya no se repite');
    });
  });
}

// ✓ on a plan line: records a payment for what's missing; on a line paid with ✓, removes that payment.
function togglePago(id){
  const l = (M().fijos || {})[id];
  if(!l) return;
  const r = L.realDe(M(), l), m = parseN(l.monto);
  if(!m) return lineaSheet(id);
  if(r >= m){
    const mine = Object.keys(M().gastos || {}).filter(gid => M().gastos[gid].planId === id);
    if(!mine.length) return lineaSheet(id); // paid through regular payments: edit them there
    const upd = {}, old = {};
    mine.forEach(gid => { upd['meses/' + cur + '/gastos/' + gid] = null; old['meses/' + cur + '/gastos/' + gid] = M().gastos[gid]; });
    patch(upd); toast(l.label + ' pendiente', () => patch(old));
    return;
  }
  const path = 'meses/' + cur + '/gastos/' + uid();
  const fecha = cur === TODAY_KEY() ? Date.now() : fromIso(cur + '-' + String(L.dueDay(cur, l.dia || 1)).padStart(2, '0'));
  set(path, {catId: l.catId, subId: l.subId || '', monto: m - r, nota: '', fecha, planId: id});
  toast(l.label + ' pagado', () => R(path).remove());
}

/* ----- ingresos del mes ----- */
function ingresosSheet(){
  const rows = {p1: [], p2: []};
  ['p1', 'p2'].forEach(p => Object.entries((M().ingresos || {})[p] || {}).forEach(([id, e]) => rows[p].push({id, label: e.label, monto: parseN(e.monto)})));
  const rowHtml = (p, r, i) => `<div class="inc-row" data-p="${p}" data-i="${i}"><button type="button" class="sign ${r.monto < 0 ? 'neg' : ''}" aria-label="Cambiar sumar o restar">${r.monto < 0 ? '−' : '+'}</button><input class="inp" data-k="label" placeholder="Concepto" value="${esc(r.label)}"><input class="inp num" data-k="monto" inputmode="decimal" placeholder="$0" value="${r.monto ? Math.abs(r.monto) : ''}"><button type="button" class="x" aria-label="Quitar">×</button></div>`;
  const body = () => ['p1', 'p2'].map(p => `<div class="field"><div class="person-h"><span class="dot" style="background:${p === 'p1' ? 'var(--p1)' : 'var(--ok)'}"></span>${esc(pname(p))}</div>${rows[p].map((r, i) => rowHtml(p, r, i)).join('')}<button type="button" class="link" data-add="${p}">+ Agregar extra o descuento</button></div>`).join('')
    + `<div class="actions"><button class="btn btn-dark btn-block" id="i-save">Guardar ingresos</button></div>`;
  openSheet('Ingresos de ' + L.monthName(cur), body(), function bind(b){
    const read = () => b.querySelectorAll('.inc-row').forEach(el => {
      const r = rows[el.dataset.p][el.dataset.i];
      r.label = el.querySelector('[data-k=label]').value;
      r.monto = Math.abs(parseN(el.querySelector('[data-k=monto]').value)) * (el.querySelector('.sign').classList.contains('neg') ? -1 : 1);
    });
    const redraw = () => { b.innerHTML = body(); bind(b); };
    b.onclick = e => {
      const el = e.target.closest('.inc-row');
      if(e.target.dataset.add){ read(); rows[e.target.dataset.add].push({id: uid(), label: '', monto: 0}); redraw(); b.querySelector(`[data-p="${e.target.dataset.add}"]:last-of-type [data-k=label]`)?.focus(); }
      else if(e.target.classList.contains('sign')) e.target.classList.toggle('neg'), e.target.textContent = e.target.classList.contains('neg') ? '−' : '+';
      else if(e.target.classList.contains('x')){ read(); rows[el.dataset.p].splice(el.dataset.i, 1); redraw(); }
    };
    b.querySelector('#i-save').onclick = () => {
      read();
      const ing = {};
      ['p1', 'p2'].forEach(p => { ing[p] = {}; rows[p].filter(r => r.monto).forEach(r => ing[p][r.id || uid()] = {label: r.label.trim() || (r.monto < 0 ? 'Descuento' : 'Extra'), monto: r.monto}); });
      set('meses/' + cur + '/ingresos', ing); closeSheet(); toast('Ingresos guardados');
    };
  });
}

/* ----- meses ----- */
function mesesSheet(){
  const keys = Object.keys(meses).sort().reverse();
  const byYear = {};
  keys.forEach(k => (byYear[k.slice(0, 4)] = byYear[k.slice(0, 4)] || []).push(k));
  let h = '';
  Object.keys(byYear).sort().reverse().forEach(y => {
    h += `<div class="day-h">${y}</div><div class="card" style="padding:2px 14px">`;
    byYear[y].forEach(k => { const d = L.totals(meses[k]).disponible; h += `<button class="list-row" data-go="${k}"><span class="grow" style="font-weight:${k === cur ? 700 : 500}">${L.monthName(k)}${k === TODAY_KEY() ? ' <span class="tag">HOY</span>' : ''}</span><span class="num m" style="color:${d < 0 ? 'var(--bad)' : 'var(--ink-2)'}">${fmt(d)}</span><span class="chev">${k === cur ? '✓' : '›'}</span></button>`; });
    h += `</div>`;
  });
  const next = L.addMonths(keys[0] || TODAY_KEY(), 1);
  h += `<div class="field" style="margin-top:16px"><label>Agregar un mes</label><div class="row2"><input class="inp" type="month" id="m-new" value="${next}"><button class="btn btn-soft" id="m-add">Crear mes</button></div></div>
        <div class="actions"><button class="btn btn-bad btn-block" id="m-del">Borrar ${L.monthLabel(cur)}</button></div>`;
  openSheet('Meses', h, b => {
    b.onclick = e => { const go = e.target.closest('[data-go]'); if(go){ cur = go.dataset.go; filtro = ''; closeSheet(); render(); } };
    b.querySelector('#m-add').onclick = () => {
      const k = b.querySelector('#m-new').value;
      if(!/^\d{4}-\d{2}$/.test(k)) return;
      cur = k; closeSheet();
      if(meses[k]) render(); else createMonth(k).then(() => toast(L.monthLabel(k) + ' creado'));
    };
    b.querySelector('#m-del').onclick = () => confirmSheet('Borrar ' + L.monthLabel(cur), 'Se borran sus ingresos, pagos y gastos para los dos. No se puede deshacer.', 'Borrar mes', () => {
      const k = cur; cur = latestBefore(k) || TODAY_KEY();
      if(k === TODAY_KEY()) cur = k; // the calendar month gets recreated empty
      set('meses/' + k, null).then(() => toast(L.monthLabel(k) + ' borrado'));
    });
  });
}

      const inp = b.querySelector('#c-newsub'), v = inp.value.trim();
      if(!v) return;
      box.insertAdjacentHTML('beforeend', `<div class="list-row" data-sid="${uid()}"><input class="inp" style="min-height:42px" value="${esc(v)}"><button type="button" class="x" aria-label="Quitar">×</button></div>`);
      inp.value = ''; inp.focus();
    };
    b.querySelector('#c-addsub').onclick = addSub;
    b.querySelector('#c-newsub').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); addSub(); } };
    if(!id) b.querySelector('#c-label').focus();
    b.querySelector('#c-save').onclick = () => {
      addSub();
      const label = b.querySelector('#c-label').value.trim();
      if(!label) return b.querySelector('#c-label').focus();
      const s = {};
      box.querySelectorAll('[data-sid]').forEach(r => { const v = r.querySelector('input').value.trim(); if(v) s[r.dataset.sid] = v; });
      const cid = id || uid();
      set('config/categorias/' + cid, {label, icon, orden: id ? (c.orden || 0) : cats().length, subs: s});
      closeSheet(); toast('Categoría guardada');
    };
    if(id) b.querySelector('#c-del').onclick = () => confirmSheet('Eliminar ' + c.label, 'La categoría desaparece de la lista. Los gastos ya registrados se conservan como "Sin categoría".', 'Eliminar', () => { set('config/categorias/' + id, null); toast('Categoría eliminada'); });
  });
}

/* ----- Apple Pay shortcut ----- */
function atajoSheet(){
  const url = location.origin + location.pathname;
  openSheet('Registrar con Apple Pay', `
    <p style="color:var(--ink-2);margin-bottom:14px">Cada vez que paguen con Apple Pay, el iPhone abre el presupuesto con el monto y el comercio ya escritos. Solo eligen la categoría. No se conecta al banco ni guarda datos de tarjetas.</p>
    <ol class="steps">
      <li>Abre la app <b>Atajos</b> → pestaña <b>Automatización</b> → <b>+</b> (Nueva automatización).</li>
      <li>Elige <b>Transacción</b>, selecciona sus tarjetas y en "Cuándo" deja <b>Toco</b>. Marca <b>Ejecutar inmediatamente</b> → Siguiente.</li>
      <li>Toca <b>Nueva automatización en blanco</b> y agrega la acción <b>Abrir URL</b>.</li>
      <li>Escribe esta dirección y, donde dice MONTO y COMERCIO, inserta las variables <b>Cantidad</b> y <b>Comerciante</b> (toca la variable "Entrada de atajo" para elegirlas):
        <span class="code">${esc(url)}?monto=MONTO&amp;comercio=COMERCIO</span></li>
      <li>Abrirá Safari: entra con Google una vez en Safari también (Safari y la app instalada guardan sesiones separadas).</li>

    <div class="actions"><button class="btn btn-soft btn-block" data-act="close">Entendido</button></div>`);
}

function handleDeepLink(){
  const q = new URLSearchParams(location.search);
  if(!q.has('monto')) return;
  deepLink = {monto: parseN(q.get('monto')) || '', nota: (q.get('comercio') || '').slice(0, 60)};
  history.replaceState(null, '', location.pathname);
  cur = TODAY_KEY(); view = 'inicio';
  gastoSheet(null, deepLink);
}

/* ======================= ACTIONS ======================= */
const actions = {
  tab: d => { view = d.v; filtro = ''; render(); scrollTo(0, 0); },
  gasto: d => gastoSheet(d.id),
  linea: d => lineaSheet(d.id),
  lineaT: d => lineaTSheet(d.id),
  togglePago: d => togglePago(d.id),
  cargarFijos: () => { const plan = {}; Object.entries(config.fijos || {}).forEach(([id, l]) => plan[id] = L.planLine(l)); set('meses/' + cur + '/fijos', plan); },
  ingresos: ingresosSheet, presu: presuSheet, meses: mesesSheet, personas: personasSheet, atajo: atajoSheet,
  categoria: d => categoriaSheet(d.id),
  verCat: d => { filtro = d.id; view = 'mov'; render(); scrollTo(0, 0); },
  filtro: d => { filtro = d.id; render(); },
  privado: () => { const on = document.body.classList.toggle('privado'); try { localStorage.setItem('privado', on ? '1' : ''); } catch(e){} render(); },
  close: closeSheet,
  logout: () => { closeSheet(); auth.signOut(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(el && actions[el.dataset.act]) actions[el.dataset.act](el.dataset);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheet.classList.contains('on')) closeSheet(); });
try { if(localStorage.getItem('privado')) document.body.classList.add('privado'); } catch(e){}
// Returning to the app on a new day/month: jump to the current calendar month.
document.addEventListener('visibilitychange', () => { if(!document.hidden && ready && !meses[TODAY_KEY()]) createMonth(TODAY_KEY()); else if(!document.hidden && ready) render(); });
</script>
